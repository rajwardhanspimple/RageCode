name: publish

# Builds the desktop app on clean runners and attaches the installers to a GitHub release.
# Tag a commit and push the tag:
#   git tag v2.2.7 && git push origin v2.2.7
# A platform whose artifact is already on the release is skipped, so a Windows installer built and
# verified locally is kept and only the missing platforms are built. The workflow uses the
# repo-scoped GITHUB_TOKEN; no personal token is stored anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (tag must already exist)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: "1"
  # The public installer is the prod channel: appId ai.ragestar.desktop, productName
  # Ragestar, no ".dev" suffix in Add/Remove Programs.
  OPENCODE_CHANNEL: "prod"
  # Pinned engine: the CLI package published to npm as 2.2.6. The shell version moves on its own.
  RAGESTAR_CLI_VERSION: "2.2.6"
  # The shell's release feed: electron-updater reads it from resources/app-update.yml, which
  # pack.ts writes only when this names a repository.
  RAGESTAR_UPDATE_REPO: "rajwardhanspimple/RageCode"
  # electron-builder and gh both read this for the GitHub release.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    if: github.repository == 'rajwardhanspimple/RageCode'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      windows: ${{ steps.release.outputs.windows }}
      linux: ${{ steps.release.outputs.linux }}
      macos: ${{ steps.release.outputs.macos }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and the assets already published
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Ragestar $version" --notes-file .github/RELEASE_NOTES.md
          fi

          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          has() { grep -qxF "$1" <<< "$assets"; }

          if has "Ragestar-Setup-$version.exe"; then echo "windows=false" >> "$GITHUB_OUTPUT"; else echo "windows=true" >> "$GITHUB_OUTPUT"; fi
          if has "Ragestar-$version-x64.AppImage"; then echo "linux=false" >> "$GITHUB_OUTPUT"; else echo "linux=true" >> "$GITHUB_OUTPUT"; fi
          if has "Ragestar-$version-arm64.dmg" && has "Ragestar-$version-x64.dmg"; then echo "macos=false" >> "$GITHUB_OUTPUT"; else echo "macos=true" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/desktop
        run: bun run build

      - name: Pack unpacked app
        working-directory: packages/desktop
        run: bun run pack

      - name: Pack NSIS installer
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $app = (Resolve-Path "../../dist/desktop/app").Path
          $env:OPENCODE_DESKTOP_APP = $app
          bun run pack

      - name: Checksums
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $setup = Get-ChildItem "dist/desktop/Ragestar-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer produced" }
          if (-not (Test-Path "dist/desktop/latest.yml")) { throw "no latest.yml produced" }
          if (-not (Test-Path "$($setup.FullName).blockmap")) { throw "no blockmap produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content "dist/desktop/SHA256SUMS.txt" -Encoding ascii
          "setup=$($setup.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
        id: artifact

      - name: Publish release
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target main --title "Ragestar $($env:TAG.TrimStart('v'))" --notes-file .github/RELEASE_NOTES.md
          }
          gh release upload $env:TAG "${{ steps.artifact.outputs.setup }}" "dist/desktop/SHA256SUMS.txt" "dist/desktop/latest.yml" "${{ steps.artifact.outputs.setup }}.blockmap" --clobber

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install rpmbuild for the rpm target
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/desktop
        run: bun run build

      - name: Package AppImage, deb and rpm
        working-directory: packages/desktop
        run: bun run pack

      - name: Publish artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for ext in AppImage deb rpm; do cp "dist/desktop/Ragestar-$VERSION-x64.$ext" release/; done
          cp dist/desktop/latest-linux.yml release/
          gh release upload "$TAG" release/* --clobber

  macos:
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel is GitHub's last x86_64 image.
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/desktop
        run: bun run build

      - name: Package dmg and zip
        working-directory: packages/desktop
        run: bun run pack

      - name: Publish artifacts
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist/desktop/Ragestar-$VERSION-$ARCH.dmg" release/
          cp "dist/desktop/Ragestar-$VERSION-$ARCH.zip" release/
          gh release upload "$TAG" release/* --clobber

  checksums:
    needs: [prepare, windows, linux, macos]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite SHA256SUMS.txt over every published asset
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          # gh resolves the repository from git unless GH_REPO is set, and this job has no checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt" and .digest != null) | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            | sort -k2 > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
